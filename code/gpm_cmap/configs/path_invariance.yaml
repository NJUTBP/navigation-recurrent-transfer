# Stage I3C: dedicated evaluation-only same-start/same-end path groups.
project_name: gpm_cmap
seed: 42
device: cuda
output_dir: outputs/runs/path_invariance_001
source_reduced_artifact: outputs/runs/source_reduced_v3_002/source_reduced_model_v3.pkl

target:
  checkpoint_manifest: outputs/runs/recurrent_factorial_confirmatory_001/checkpoint_manifest.json
  checkpoints: []
  conditions:
    - Ohh-navigation__Oih-navigation__Thh-frozen__Tih-frozen
    - Ohh-navigation__Oih-navigation__Thh-trainable__Tih-trainable
    - Ohh-matched_random__Oih-matched_random__Thh-frozen__Tih-frozen
    - Ohh-matched_random__Oih-matched_random__Thh-trainable__Tih-trainable
  episode_budgets: [1000]

data:
  task_name: social_hierarchy
  n_levels: 8
  train_path_length: [1, 5]
  id_test_path_length: [1, 5]
  long_test_path_length: [6, 12]
  episode_budgets: [10, 20, 50, 100, 200, 500, 1000]
  validation_episodes: 1000
  id_test_episodes: 2000
  long_test_episodes: 2000
  composition_test_episodes: 2000
  held_out_action_bigrams: [[0, 2], [1, 3], [2, 1], [3, 0]]
  velocity_scale: 0.02
  coord_scale: 0.02
  batch_size: 128
  num_workers: 0
  seed_offsets:
    train: 1001
    validation: 2001
    id_test: 3001
    long_test: 4001
    composition_test: 5001

path_dataset:
  n_levels: 8
  n_groups: 512
  velocity_scale: 0.02
  coord_scale: 0.02
  zero_padding_steps: 4
  seed_offset: 90001
analysis:
  decoder_pca_dim: 64
  min_endpoint_accuracy: 0.80
  source_baseline_multiplier: 1.50
  phase_dispersion_floor: 0.05
  max_loop_holonomy: 0.35
  max_padding_phase_difference: 0.25
  path_decoder_chance_tolerance: 0.10
  max_residual_time_r2: 0.20
runtime:
  cpu_num_threads: 1
  allow_device_fallback: false
  deterministic_algorithms: false
