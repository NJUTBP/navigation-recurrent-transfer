# =====================================================================
# Schøyen-anchored source reduced model v1 (single navigation source)
#
# Claim scope for every result:
#   conditional on the analyzed navigation source
#
# This configuration defines the source-reduced stage of the rebuilt FigureA3.
# Target factorial models are not retrained here; the standalone FigureA3 runner
# subsequently reuses their completed checkpoints for action/path evaluation.
# =====================================================================

project_name: gpm_cmap
seed: 42
device: cpu
output_dir: outputs/runs/source_reduced_schoyen_001

source:
  # Schøyen Euclidean formal topology and independent source split paths are injected by the MultiNav FigureA3 runner.
  analysis_dir: outputs/runs/torus_holdout_001
  topology_arrays: null  # inferred from analysis_dir/run_provenance.json

  # Independent long-rollout exports generated by
  # gpm_cmap.experiments.export_schoyen_source_splits.
  fit_arrays: outputs/runs/source_reduced_splits_001/source_fit_arrays.npz
  validation_arrays: outputs/runs/source_reduced_splits_001/source_validation_arrays.npz
  test_arrays: outputs/runs/source_reduced_splits_001/source_test_arrays.npz
  split_manifest: outputs/runs/source_reduced_splits_001/source_reduced_split_manifest.json
  checkpoint: outputs/nav_pretrain_full/best.pt

  # Apply the same source filter to all three v3 splits. Test is never used for
  # standardization, PCA, GL(2,Z), Fourier order, regularization, fibre dimension,
  # decoder context, or dynamics selection.
  burn_in_steps: 50
  min_step_displacement: 0.0005

  # No matched non-grid control is generated in this FigureA3 replacement.
  # The mechanism question is conditional on the Schøyen-selected ensemble.
  non_grid:
    enabled: false

model:
  # Frozen topology-derived phase encoder.
  chart_dim: 8

  phase:
    max_gl2z_entry: 2
    basis_search_alpha: 1.0e-6
    action_alphas: [1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2, 1.0]
    residual_orders: [1, 2]
    residual_alphas: [1.0e-6, 1.0e-4, 1.0e-2, 1.0]
    residual_min_relative_improvement: 0.01
    state_only_order: 2
    state_only_alpha: 1.0e-3

  decoder:
    # S0 and S1 hierarchy. Validation rollout NMTE is the primary selection
    # metric; reconstruction is retained as a diagnostic.
    orders: [1, 2, 3, 4, 5, 6]
    alphas: [1.0e-6, 1.0e-4, 1.0e-2, 1.0, 100.0]
    context_modes:
      - none
      - previous_velocity
      - current_velocity
      - previous_current_velocity
    conditioned_min_relative_rollout_improvement: 0.00
    min_rollout_steps: 2

  fibre:
    candidate_dims: [0, 1, 2, 4, 6, 8, 12, 16, 24, 32]
    # A low-dimensional-fibre claim additionally requires that the best
    # validation dimension is not the candidate cap and that dimensions beyond
    # the one-SE choice improve residual MFE by no more than this fraction.
    plateau_relative_gain: 0.02

  fibre_dynamics:
    # S3 hierarchy, in increasing flexibility. Candidate selection uses
    # source-validation multi-step hidden rollout NMTE.
    linear_alphas: [1.0e-6, 1.0e-4, 1.0e-2, 1.0]
    # Dense degree-3 expansion is intentionally not a default: at k=32 it can
    # exceed 10,000 features and make the formal 128x500 fit intractable.
    polynomial_degrees: [2]
    polynomial_alphas: [1.0e-5, 1.0e-3, 1.0e-1, 10.0]
    max_polynomial_features: 2048
    local_clusters: [4, 8, 16]
    local_alphas: [1.0e-5, 1.0e-3, 1.0e-1]
    enable_active_set_model: true
    active_set_alphas: [1.0e-5, 1.0e-3, 1.0e-1]
    active_max_units: 16
    active_max_regimes: 64
    active_min_samples: 32
    min_rollout_steps: 2

  baselines:
    linear_state_space_alpha: 1.0e-4


schoyen_phase:
  # Coordinate chart is fitted on an independent source-calibration split.
  ratemap_resolution: 64
  ratemap_smooth_sigma: 1.0
  max_chart_landmarks: 8000
  # Search radius in Fourier-bin units for periodic axes.  The three Schøyen
  # KMeans band families are used first; population peaks are a fallback.
  max_fft_frequency: 16
  # arena_size is overwritten from the locked navigation config by the runner.
  arena_size: 2.2

analysis:
  require_source_split_manifest: true
  require_disjoint_trajectory_fingerprints: true
  strict_missing: true
  strict_schema: true
  strict_provenance: true

  bootstrap_samples: 2000
  min_rollout_steps: 2

  quality_gates:
    # Exact two-dimensional controlled torus gate.
    exact_max_surface_mfe: 0.50
    exact_max_rollout_nmte: 0.50
    exact_min_torus_tangent_fraction: 0.50
    max_normalized_additive_phase_rmse: 0.75
    min_velocity_specificity_ratio: 1.25

    # Toroidal-base-plus-fibre gate.
    full_max_surface_mfe: 0.50
    full_max_rollout_nmte: 0.50
    full_min_tangent_fraction: 0.70
    min_phase_null_to_full_rollout_ratio: 1.10

runtime:
  cpu_num_threads: 1
  allow_device_fallback: false
  deterministic_algorithms: false
